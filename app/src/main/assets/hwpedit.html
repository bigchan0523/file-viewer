<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한글 편집</title>
<style>
  :root { --ink:#1d2129; --sub:#6b7280; --accent:#2f6bff; }
  html, body { margin:0; height:100%; overflow:hidden; background:#eef0f3; color:var(--ink);
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; -webkit-tap-highlight-color:transparent; }
  body { display:flex; flex-direction:column; }
  #ebar { flex:none; display:flex; align-items:center; gap:6px; padding:6px 8px; background:#2f6bff; color:#fff; }
  #ebar button { border:0; border-radius:10px; padding:8px 12px; font-family:inherit; font-size:14.5px; background:rgba(255,255,255,.16); color:#fff; }
  #ebar .grow { flex:1; min-width:0; font-size:13px; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #ebar .save { background:#fff; color:var(--accent); font-weight:700; }
  #editor { flex:1; min-height:0; position:relative; }
  #editor iframe { border:0; display:block; }

  #sheet { position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; }
  #sheet .box { width:100%; background:#fff; border-radius:18px 18px 0 0; padding:8px 0 14px; max-height:80vh; overflow:auto; }
  #sheet .h { font-size:13px; color:var(--sub); padding:10px 20px 6px; }
  #sheet button { display:flex; align-items:center; gap:14px; width:100%; border:0; background:none; text-align:left;
    padding:15px 20px; font-family:inherit; font-size:16px; color:var(--ink); }
  #sheet button:active { background:#f2f4f7; }
  #sheet button i { font-style:normal; width:24px; text-align:center; font-size:18px; }
  #sheet .note { font-size:12px; color:var(--sub); margin-left:auto; }

  #busy { position:fixed; inset:0; z-index:40; background:rgba(255,255,255,.75); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px; font-size:15px; color:var(--sub); }
  .spinner { width:34px; height:34px; border:3px solid #d5d9e0; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:50; background:#1d2129; color:#fff;
    border-radius:10px; padding:10px 14px; font-size:13.5px; max-width:90%; text-align:center; pointer-events:none; }
  #info { position:fixed; inset:0; z-index:35; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; }
  #info .box { width:min(92%, 420px); background:#fff; border-radius:16px; padding:18px 20px; }
  #info h3 { margin:0 0 12px; font-size:17px; }
  #info table { width:100%; font-size:14.5px; border-collapse:collapse; }
  #info td { padding:7px 0; vertical-align:top; } #info td:first-child { color:var(--sub); width:90px; }
  #info button { margin-top:14px; width:100%; border:0; border-radius:10px; padding:12px; font-family:inherit; font-size:15px; background:#eef0f3; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="ebar">
  <button id="bMenu" aria-label="메뉴">☰ 메뉴</button>
  <div class="grow" id="state">편집 중</div>
  <button id="bDone">수정 종료</button>
  <button id="bSave" class="save">저장</button>
</div>
<div id="editor"></div>
<div id="sheet" hidden></div>
<div id="info" hidden></div>
<div id="busy"><div class="spinner"></div><div id="busyText">편집기 여는 중…</div></div>
<div id="toast" hidden></div>
<script type="module" src="hwpedit.js"></script>
</body>
</html>
